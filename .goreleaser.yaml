version: 2

project_name: genesisdb-orchestrator

before:
  hooks:
    - go mod tidy

builds:
  - id: genesisdb
    main: ./cmd/genesisdb
    binary: genesisdb
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: genesisdb
    name_template: "genesisdb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - install.sh
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
  groups:
    - title: features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: other
      order: 999

release:
  github:
    owner: genesisdb-io
    name: genesisdb-orchestrator
  draft: false
  prerelease: auto
  header: |
    ## GenesisDB Orchestrator {{ .Tag }}

    Install on macOS or Linux:

    ```bash
    curl -fsSL https://orchestrator.genesisdb.io/install.sh | bash
    ```

    Or download an archive below, extract `genesisdb`, and place it on your `PATH`.
